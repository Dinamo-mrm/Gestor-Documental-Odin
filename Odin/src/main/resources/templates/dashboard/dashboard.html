<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f5f6f8] text-slate-800">

<div class="min-h-screen flex">

    <!-- SIDEBAR -->
    <div th:replace="fragments/layout :: sidebar('dashboard')"></div>

    <div id="overlay"
         class="fixed inset-0 bg-black/40 z-20 hidden">
    </div>

    <!-- CONTENIDO -->
    <div class="flex-1 min-w-0">

        <!-- TOPBAR -->
        <div th:replace="fragments/layout :: topbar('ODIN')"></div>

        <main class="px-4 md:px-8 py-6">

            <!-- ENCABEZADO -->
            <section class="mb-8">

                <h1 class="text-3xl font-extrabold text-slate-900 uppercase">
                    Dashboard
                </h1>

                <p class="text-sm text-slate-500 mt-2">
                    Resumen general del sistema ODIN.
                </p>

            </section>

            <!-- TARJETAS -->
            <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-5">

                <!-- TRAMITES -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                    <p class="text-xs uppercase font-bold text-slate-500">
                        Trámites
                    </p>

                    <h2 class="mt-3 text-4xl font-extrabold text-[#2fa300]"
                        th:text="${totalTramites}">
                        0
                    </h2>
                </div>

                <!-- PLANTILLAS -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                    <p class="text-xs uppercase font-bold text-slate-500">
                        Plantillas
                    </p>

                    <h2 class="mt-3 text-4xl font-extrabold text-blue-600"
                        th:text="${totalPlantillas}">
                        0
                    </h2>
                </div>

                <!-- RADICADOS -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                    <p class="text-xs uppercase font-bold text-slate-500">
                        Radicados
                    </p>

                    <h2 class="mt-3 text-4xl font-extrabold text-purple-600"
                        th:text="${totalRadicados}">
                        0
                    </h2>
                </div>

                <!-- REASIGNACIONES -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                    <p class="text-xs uppercase font-bold text-slate-500">
                        Reasignaciones
                    </p>

                    <h2 class="mt-3 text-4xl font-extrabold text-orange-500"
                        th:text="${totalReasignaciones}">
                        0
                    </h2>
                </div>

                <!-- USUARIOS -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                    <p class="text-xs uppercase font-bold text-slate-500">
                        Usuarios
                    </p>

                    <h2 class="mt-3 text-4xl font-extrabold text-red-500"
                        th:text="${totalUsuarios}">
                        0
                    </h2>
                </div>

            </section>

            <!-- PANEL INFORMATIVO -->
            <section class="mt-8">

                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">

                    <h3 class="text-lg font-bold text-slate-800 mb-3">
                        Información general
                    </h3>

                    <p class="text-slate-600 leading-relaxed">
                        Este panel muestra la cantidad total de registros
                        existentes en el sistema para trámites, plantillas,
                        radicados, reasignaciones y usuarios.
                    </p>

                </div>

            </section>

        </main>

    </div>

</div>

<script th:src="@{/js/script.js}" defer></script>

</body>
</html>
