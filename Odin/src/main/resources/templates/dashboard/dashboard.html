<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f5f6f8] text-slate-800">

<div class="min-h-screen flex">

    <!-- SIDEBAR -->
    <div th:replace="fragments/layout :: sidebar('dashboard')"></div>

    <div class="fixed inset-0 bg-black/40 z-20 hidden"
         id="overlay">
    </div>

    <!-- CONTENIDO -->
    <div class="flex-1 min-w-0">

        <!-- TOPBAR -->
        <div th:replace="fragments/layout :: topbar('ODIN')"></div>

        <main class="px-4 md:px-8 py-6">

            <!-- ENCABEZADO -->
            <section class="mb-8">

                <h1 class="text-3xl font-extrabold text-slate-900 uppercase">
                    Dashboard
                </h1>

                <p class="text-sm text-slate-500 mt-2">
                    Resumen general del sistema ODIN.
                </p>

            </section>

            <!-- TARJETAS -->
            <section class="grid grid-cols-2 md:grid-cols-4 gap-5 mt-6">

                <div class="bg-white rounded-xl p-5 border shadow-sm">
                    <p class="text-xs font-bold uppercase text-slate-500">
                        Pendientes
                    </p>

                    <h2 class="text-3xl font-bold text-yellow-600"
                        th:text="${pendientes}">
                        0
                    </h2>
                </div>

                <div class="bg-white rounded-xl p-5 border shadow-sm">
                    <p class="text-xs font-bold uppercase text-slate-500">
                        Finalizados
                    </p>

                    <h2 class="text-3xl font-bold text-green-600"
                        th:text="${finalizados}">
                        0
                    </h2>
                </div>

                <div class="bg-white rounded-xl p-5 border shadow-sm">
                    <p class="text-xs font-bold uppercase text-slate-500">
                        Devueltos/Rechazados
                    </p>

                    <h2 class="text-3xl font-bold text-red-600"
                        th:text="${problemas}">
                        0
                    </h2>
                </div>

                <div class="bg-white rounded-xl p-5 border shadow-sm">
                    <p class="text-xs font-bold uppercase text-slate-500">
                        Vencidos
                    </p>

                    <h2 class="text-3xl font-bold text-red-700"
                        th:text="${vencidos}">
                        0
                    </h2>
                </div>

            </section>

            <section class="mt-8">

                <div class="bg-white rounded-xl p-6 border shadow-sm">

                    <h3 class="font-bold mb-4">
                        Estado de los Radicados
                    </h3>

                    <canvas id="estadoChart"></canvas>

                </div>

            </section>


            <!-- PANEL INFORMATIVO -->
            <section class="mt-8 grid grid-cols-1 xl:grid-cols-2 gap-6">

                <!-- GRÁFICO -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">

                    <h3 class="font-bold text-slate-800 mb-4">
                        Distribución General
                    </h3>

                    <canvas id="dashboardChart"></canvas>

                </div>

                <!-- ÚLTIMOS RADICADOS -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">

                    <h3 class="font-bold text-slate-800 mb-4">
                        Últimos Radicados
                    </h3>

                    <div class="overflow-auto max-h-80">

                        <table class="w-full text-sm">

                            <thead>
                            <tr class="border-b">
                                <th class="text-left py-2">Número</th>
                                <th class="text-left py-2">Asunto</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="r : ${ultimosRadicados}">

                                <td class="py-2"
                                    th:text="${r.numeroRadicado}">
                                </td>

                                <td class="py-2"
                                    th:text="${r.asunto}">
                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>

</div>

<script defer th:src="@{/js/script.js}"></script>
<script th:inline="javascript">

    const pendientes = [[${pendientes != null ? pendientes : 0}]];
    const finalizados = [[${finalizados != null ? finalizados : 0}]];
    const problemas = [[${problemas != null ? problemas : 0}]];
    const vencidos = [[${vencidos != null ? vencidos : 0}]];

    const estadoCanvas = document.getElementById('estadoChart');

    if (estadoCanvas) {

        new Chart(estadoCanvas, {

            type: 'doughnut',

            data: {

                labels: [
                    'Pendientes',
                    'Finalizados',
                    'Problemas',
                    'Vencidos'
                ],

                datasets: [{
                    data: [
                        pendientes,
                        finalizados,
                        problemas,
                        vencidos
                    ]
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    }

    const dashboardCanvas =
        document.getElementById('dashboardChart');

    if (dashboardCanvas) {

        new Chart(dashboardCanvas, {

            type: 'bar',

            data: {

                labels: [
                    'Pendientes',
                    'Finalizados',
                    'Problemas',
                    'Vencidos'
                ],

                datasets: [{

                    label: 'Radicados',

                    data: [
                        pendientes,
                        finalizados,
                        problemas,
                        vencidos
                    ]
                }]
            },

            options: {

                responsive: true,

                scales: {

                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

</script>

</body>
</html>
