<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Trámite | ODIN</title>

    

    

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/styleguide.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/odin.css}">
    <link rel="stylesheet" th:href="@{/css/odin-dark.css}">
</head>
<body class="bg-[#f5f6f8] text-slate-800">

<div class="min-h-screen flex">

    <!-- SIDEBAR con menú hamburguesa responsive -->
    <div th:replace="~{fragments/layout :: sidebar('tramites')}"></div>

    <!-- Overlay móvil -->
    <div class="fixed inset-0 bg-black/40 z-20 hidden" id="overlay" aria-hidden="true"></div>

    <!-- CONTENIDO -->
    <div class="flex-1 min-w-0 flex flex-col">

        <!-- TOPBAR (incluye botón hamburguesa en móvil) -->
        <div th:replace="~{fragments/layout :: topbar('Trámites')}"></div>

        <main class="px-4 md:px-8 py-6 flex-1">
<section class="mb-8">
                <h1 class="odin-page-title">
                    Nuevo / Editar Trámite
                </h1>

                <p class="text-sm text-slate-500 mt-2">
                    Cree o actualice la configuración de un trámite.
                </p>
            </section>

            <form th:action="@{/view/tramites/save}"
                  th:object="${tramites}"
                  method="post"
                  class="space-y-6">

                <!-- ID -->
                <input type="hidden" th:field="*{idTramite}"/>

                <div class="bg-white rounded-xl border border-slate-200 shadow-sm">

                    <div class="px-6 py-4 border-b border-slate-100">
                        <h2 class="font-bold text-slate-700">
                            Información General
                        </h2>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold mb-2">
                                Nombre del trámite
                            </label>

                            <input type="text"
                                   th:field="*{nombre}"
                                   required
                                   class="w-full rounded-lg border border-slate-300 px-4 py-3">
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold mb-2">
                                Descripción
                            </label>

                            <textarea th:field="*{descripcion}"
                                      rows="4"
                                      required
                                      class="w-full rounded-lg border border-slate-300 px-4 py-3"></textarea>
                        </div>

                    </div>
                </div>

                <div class="bg-white rounded-xl border border-slate-200 shadow-sm">

                    <div class="px-6 py-4 border-b border-slate-100">
                        <h2 class="font-bold text-slate-700">
                            Configuración del Trámite
                        </h2>
                    </div>

                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div>
                            <label class="block text-sm font-semibold mb-2">
                                Dependencia Responsable
                            </label>

                            <input type="number"
                                   th:field="*{idDependenciaResponsable}"
                                   class="w-full rounded-lg border border-slate-300 px-4 py-3">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">
                                Estado Inicial
                            </label>

                            <input type="number"
                                   th:field="*{idEstadoInicial}"
                                   class="w-full rounded-lg border border-slate-300 px-4 py-3">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">
                                Días de Respuesta
                            </label>

                            <input type="number"
                                   th:field="*{diasRespuesta}"
                                   class="w-full rounded-lg border border-slate-300 px-4 py-3">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">
                                Prioridad
                            </label>

                            <select th:field="*{prioridadDefault}"
                                    class="w-full rounded-lg border border-slate-300 px-4 py-3">

                                <option value="">Seleccione</option>
                                <option value="BAJA">BAJA</option>
                                <option value="MEDIA">MEDIA</option>
                                <option value="ALTA">ALTA</option>
                                <option value="URGENTE">URGENTE</option>

                            </select>
                        </div>

                        <div>
                            <label class="flex items-center gap-3">

                                <input type="checkbox"
                                       th:field="*{activo}">

                                <span class="text-sm font-semibold">
                                    Trámite Activo
                                </span>

                            </label>
                        </div>

                        <div>
                            <label class="flex items-center gap-3">

                                <input type="checkbox"
                                       th:field="*{requiereRespuesta}">

                                <span class="text-sm font-semibold">
                                    Requiere Respuesta
                                </span>

                            </label>
                        </div>

                    </div>

                </div>

                <div class="flex justify-end gap-4">

                    <a th:href="@{/view/tramites}"
                       class="px-6 py-3 rounded-lg border border-slate-300">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="px-8 py-3 rounded-lg bg-[#2fa300] text-white font-bold hover:bg-[#248400]">
                        Guardar Trámite
                    </button>

                </div>

            </form>
        </main>



    </div>
</div>

    <script defer th:src="@{/js/script.js}"></script>
    <script defer th:src="@{/js/odin-ui.js}"></script>
</body>
</html>
