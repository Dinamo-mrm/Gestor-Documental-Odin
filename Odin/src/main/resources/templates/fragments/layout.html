<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>


<!-- =========================================================
     SIDEBAR
     AUTOCONTENIDO:
     - Submenús
     - Estado activo
     - Responsive
     - Logout
========================================================= -->

<aside th:fragment="sidebar(activeMenu)"
       id="sidebar"
       class="odin-sidebar">

    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="odin-sidebar-header">

        <a th:href="@{/view/dashboard}"
           class="odin-brand">

            <div class="odin-brand-icon">
                O
            </div>

            <div class="odin-brand-text">
                <strong>ODIN</strong>
                <span>Gestión Documental</span>
            </div>

        </a>


        <!-- SOLO MÓVIL -->

        <button type="button"
                class="odin-sidebar-close"
                aria-label="Cerrar menú"
                onclick="odinCloseSidebar()">

            ✕

        </button>

    </div>


    <!-- =====================================================
         NAVEGACIÓN
    ====================================================== -->

    <nav class="odin-sidebar-nav">


        <!-- =================================================
             DASHBOARD
        ================================================== -->

        <a th:href="@{/view/dashboard}"
           class="odin-sidebar-item"
           th:classappend="${activeMenu == 'dashboard'}
                ? ' odin-sidebar-item-active'
                : ''">

            <span class="odin-sidebar-icon">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">

                    <rect x="3"
                          y="3"
                          width="7"
                          height="7"
                          rx="1"/>

                    <rect x="14"
                          y="3"
                          width="7"
                          height="7"
                          rx="1"/>

                    <rect x="3"
                          y="14"
                          width="7"
                          height="7"
                          rx="1"/>

                    <rect x="14"
                          y="14"
                          width="7"
                          height="7"
                          rx="1"/>

                </svg>

            </span>

            <span>Dashboard</span>

        </a>



        <!-- =================================================
             CONTROL DE ACCESO
        ================================================== -->

        <div class="odin-sidebar-dropdown"
             sec:authorize="hasAnyAuthority(
                'admin_usuarios',
                'admin_roles',
                'ver_usuarios'
             )">


            <button type="button"
                    class="odin-sidebar-item odin-sidebar-dropdown-button"

                    th:classappend="${activeMenu == 'usuarios'
                                  || activeMenu == 'roles'}
                        ? ' odin-sidebar-parent-active'
                        : ''"

                    th:attr="aria-expanded=${activeMenu == 'usuarios'
                                           || activeMenu == 'roles'}"

                    data-submenu="accessSubmenu"

                    onclick="odinToggleSubmenu(
                        'accessSubmenu',
                        this
                    )">


                <span class="odin-sidebar-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8">

                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>

                        <circle cx="9"
                                cy="7"
                                r="4"/>

                        <path d="M19 8v6"/>

                        <path d="M22 11h-6"/>

                    </svg>

                </span>


                <span>
                    Control de Acceso
                </span>


                <svg class="odin-sidebar-chevron"

                     th:classappend="${activeMenu == 'usuarios'
                                   || activeMenu == 'roles'}
                        ? ' odin-chevron-open'
                        : ''"

                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="m9 18 6-6-6-6"/>

                </svg>

            </button>



            <!-- SUBMENÚ CONTROL DE ACCESO -->

            <div id="accessSubmenu"
                 class="odin-sidebar-submenu"

                 th:classappend="${activeMenu == 'usuarios'
                               || activeMenu == 'roles'}
                    ? ''
                    : ' odin-hidden'">


                <!-- USUARIOS -->

                <a th:href="@{/view/usuarios}"
                   class="odin-sidebar-subitem"

                   sec:authorize="hasAnyAuthority(
                        'admin_usuarios',
                        'ver_usuarios'
                   )"

                   th:classappend="${activeMenu == 'usuarios'}
                        ? ' odin-sidebar-subitem-active'
                        : ''">

                    Usuarios

                </a>


                <!-- ROLES -->

                <a th:href="@{/view/roles}"
                   class="odin-sidebar-subitem"

                   sec:authorize="hasAuthority('admin_roles')"

                   th:classappend="${activeMenu == 'roles'}
                        ? ' odin-sidebar-subitem-active'
                        : ''">

                    Roles y Permisos

                </a>

            </div>

        </div>



        <!-- =================================================
             DEPENDENCIAS
        ================================================== -->

        <a th:href="@{/view/dependencias}"
           class="odin-sidebar-item"

           sec:authorize="hasAuthority('ver_dependencias')"

           th:classappend="${activeMenu == 'dependencias'}
                ? ' odin-sidebar-item-active'
                : ''">


            <span class="odin-sidebar-icon">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">

                    <path d="M3 21h18"/>

                    <path d="M5 21V8l7-5 7 5v13"/>

                    <path d="M9 21v-6h6v6"/>

                </svg>

            </span>


            <span>
                Dependencias
            </span>

        </a>



        <!-- =================================================
             RADICADOS
        ================================================== -->

        <a th:href="@{/view/radicados}"
           class="odin-sidebar-item"

           sec:authorize="hasAuthority('ver_radicados')"

           th:classappend="${activeMenu == 'radicados'}
                ? ' odin-sidebar-item-active'
                : ''">


            <span class="odin-sidebar-icon">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">

                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>

                    <path d="M14 2v6h6"/>

                    <path d="M8 13h8"/>

                    <path d="M8 17h8"/>

                </svg>

            </span>


            <span>
                Radicados
            </span>

        </a>



        <!-- =================================================
             REASIGNACIONES
        ================================================== -->

        <a th:href="@{/view/reasignaciones}"
           class="odin-sidebar-item"

           sec:authorize="hasAuthority('trasladar_radicado')"

           th:classappend="${activeMenu == 'reasignaciones'}
                ? ' odin-sidebar-item-active'
                : ''">


            <span class="odin-sidebar-icon">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">

                    <path d="M17 3l4 4-4 4"/>

                    <path d="M3 7h18"/>

                    <path d="M7 21l-4-4 4-4"/>

                    <path d="M21 17H3"/>

                </svg>

            </span>


            <span>
                Reasignaciones
            </span>

        </a>



        <!-- =================================================
             GESTIÓN DOCUMENTAL
        ================================================== -->

        <div class="odin-sidebar-dropdown"
             sec:authorize="hasAuthority('admin_ccd')">


            <button type="button"
                    class="odin-sidebar-item odin-sidebar-dropdown-button"

                    th:classappend="${activeMenu == 'estados'
                                  || activeMenu == 'series'
                                  || activeMenu == 'subseries'}
                        ? ' odin-sidebar-parent-active'
                        : ''"

                    th:attr="aria-expanded=${activeMenu == 'estados'
                                           || activeMenu == 'series'
                                           || activeMenu == 'subseries'}"

                    data-submenu="documentSubmenu"

                    onclick="odinToggleSubmenu(
                        'documentSubmenu',
                        this
                    )">


                <span class="odin-sidebar-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8">

                        <path d="M4 4h16v16H4z"/>

                        <path d="M8 8h8"/>

                        <path d="M8 12h8"/>

                        <path d="M8 16h5"/>

                    </svg>

                </span>


                <span>
                    Gestión Documental
                </span>


                <svg class="odin-sidebar-chevron"

                     th:classappend="${activeMenu == 'estados'
                                   || activeMenu == 'series'
                                   || activeMenu == 'subseries'}
                        ? ' odin-chevron-open'
                        : ''"

                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="m9 18 6-6-6-6"/>

                </svg>

            </button>



            <!-- SUBMENÚ GESTIÓN DOCUMENTAL -->

            <div id="documentSubmenu"
                 class="odin-sidebar-submenu"

                 th:classappend="${activeMenu == 'estados'
                               || activeMenu == 'series'
                               || activeMenu == 'subseries'}
                    ? ''
                    : ' odin-hidden'">


                <!-- ESTADOS -->

                <a th:href="@{/view/estados}"
                   class="odin-sidebar-subitem"

                   th:classappend="${activeMenu == 'estados'}
                        ? ' odin-sidebar-subitem-active'
                        : ''">

                    Estados

                </a>


                <!-- SERIES -->

                <a th:href="@{/view/series}"
                   class="odin-sidebar-subitem"

                   th:classappend="${activeMenu == 'series'}
                        ? ' odin-sidebar-subitem-active'
                        : ''">

                    Series

                </a>


                <!-- SUBSERIES -->

                <a th:href="@{/view/subseries}"
                   class="odin-sidebar-subitem"

                   th:classappend="${activeMenu == 'subseries'}
                        ? ' odin-sidebar-subitem-active'
                        : ''">

                    Subseries

                </a>

            </div>

        </div>



        <!-- =================================================
             TRÁMITES
        ================================================== -->

        <a th:href="@{/view/tramites}"
           class="odin-sidebar-item"

           sec:authorize="hasAuthority('ver_tramites')"

           th:classappend="${activeMenu == 'tramites'}
                ? ' odin-sidebar-item-active'
                : ''">


            <span class="odin-sidebar-icon">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">

                    <path d="M9 11l3 3L22 4"/>

                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>

                </svg>

            </span>


            <span>
                Trámites
            </span>

        </a>



        <!-- =================================================
             REPORTES
        ================================================== -->

        <a th:href="@{/view/reportes}"
           class="odin-sidebar-item"

           sec:authorize="hasAuthority('ver_reportes')"

           th:classappend="${activeMenu == 'reportes'}
                ? ' odin-sidebar-item-active'
                : ''">


            <span class="odin-sidebar-icon">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">

                    <path d="M4 19V9"/>

                    <path d="M10 19V5"/>

                    <path d="M16 19v-7"/>

                    <path d="M22 19H2"/>

                </svg>

            </span>


            <span>
                Reportes
            </span>

        </a>


    </nav>



    <!-- =====================================================
         FOOTER / USUARIO / LOGOUT
    ====================================================== -->

    <div class="odin-sidebar-footer">


        <div class="odin-sidebar-user">


            <div class="odin-sidebar-avatar">

                <span th:text="${#authentication != null
                        && #authentication.name != null
                        ? #strings.substring(
                            #authentication.name,
                            0,
                            1
                          ).toUpperCase()
                        : 'U'}">

                    U

                </span>

            </div>


            <div class="odin-sidebar-user-info">

                <strong>
                    Usuario ODIN
                </strong>

                <span th:text="${#authentication != null
                        ? #authentication.name
                        : 'Sesión activa'}">

                    Sesión activa

                </span>

            </div>

        </div>



        <!-- =================================================
             LOGOUT REAL SPRING SECURITY
        ================================================== -->

        <form th:action="@{/logout}"
              method="post"
              class="odin-logout-form">


            <button type="submit"
                    class="odin-sidebar-logout-button">


                <span class="odin-sidebar-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8">

                        <path d="M10 17l5-5-5-5"/>

                        <path d="M15 12H3"/>

                        <path d="M21 19V5a2 2 0 0 0-2-2h-6"/>

                    </svg>

                </span>


                <span>
                    Cerrar sesión
                </span>

            </button>

        </form>

    </div>



    <!-- =====================================================
         JAVASCRIPT DEL SIDEBAR
         VA DENTRO DEL FRAGMENTO.
         NO NECESITAS layoutScripts EN LAS VISTAS.
    ====================================================== -->

    <script>

        /*
         * =====================================================
         * ABRIR / CERRAR SUBMENÚ
         * =====================================================
         */

        window.odinToggleSubmenu = function (
            submenuId,
            button
        ) {

            const submenu =
                document.getElementById(submenuId);


            if (!submenu) {

                console.error(
                    "ODIN: no se encontró el submenu:",
                    submenuId
                );

                return;

            }


            const wasHidden =
                submenu.classList.contains(
                    "odin-hidden"
                );


            /*
             * ---------------------------------------------
             * CERRAR OTROS SUBMENÚS
             * ---------------------------------------------
             */

            document
                .querySelectorAll(
                    ".odin-sidebar-submenu"
                )
                .forEach(function (otherSubmenu) {


                    if (otherSubmenu === submenu) {
                        return;
                    }


                    otherSubmenu
                        .classList
                        .add("odin-hidden");


                    const otherButton =
                        document.querySelector(
                            '[data-submenu="' +
                            otherSubmenu.id +
                            '"]'
                        );


                    if (!otherButton) {
                        return;
                    }


                    otherButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );


                    const otherChevron =
                        otherButton.querySelector(
                            ".odin-sidebar-chevron"
                        );


                    if (otherChevron) {

                        otherChevron
                            .classList
                            .remove(
                                "odin-chevron-open"
                            );

                    }

                });



            /*
             * ---------------------------------------------
             * ABRIR ACTUAL
             * ---------------------------------------------
             */

            if (wasHidden) {


                submenu
                    .classList
                    .remove("odin-hidden");


                if (button) {


                    button.setAttribute(
                        "aria-expanded",
                        "true"
                    );


                    const chevron =
                        button.querySelector(
                            ".odin-sidebar-chevron"
                        );


                    if (chevron) {

                        chevron
                            .classList
                            .add(
                                "odin-chevron-open"
                            );

                    }

                }


                return;

            }



            /*
             * ---------------------------------------------
             * CERRAR ACTUAL
             * ---------------------------------------------
             */

            submenu
                .classList
                .add("odin-hidden");


            if (button) {


                button.setAttribute(
                    "aria-expanded",
                    "false"
                );


                const chevron =
                    button.querySelector(
                        ".odin-sidebar-chevron"
                    );


                if (chevron) {

                    chevron
                        .classList
                        .remove(
                            "odin-chevron-open"
                        );

                }

            }

        };



        /*
         * =====================================================
         * ABRIR SIDEBAR MÓVIL
         * =====================================================
         */

        window.odinOpenSidebar = function () {


            const sidebar =
                document.getElementById(
                    "sidebar"
                );


            const overlay =
                document.getElementById(
                    "overlay"
                );


            if (!sidebar) {
                return;
            }


            sidebar
                .classList
                .add(
                    "odin-sidebar-mobile-open"
                );


            if (overlay) {

                overlay
                    .classList
                    .remove("hidden");

            }


            document
                .body
                .classList
                .add("odin-no-scroll");

        };



        /*
         * =====================================================
         * CERRAR SIDEBAR MÓVIL
         * =====================================================
         */

        window.odinCloseSidebar = function () {


            const sidebar =
                document.getElementById(
                    "sidebar"
                );


            const overlay =
                document.getElementById(
                    "overlay"
                );


            if (sidebar) {

                sidebar
                    .classList
                    .remove(
                        "odin-sidebar-mobile-open"
                    );

            }


            if (overlay) {

                overlay
                    .classList
                    .add("hidden");

            }


            document
                .body
                .classList
                .remove("odin-no-scroll");

        };



        /*
         * =====================================================
         * OVERLAY
         * =====================================================
         */

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const overlay =
                    document.getElementById(
                        "overlay"
                    );


                if (overlay) {

                    overlay.addEventListener(
                        "click",
                        function () {

                            window
                                .odinCloseSidebar();

                        }
                    );

                }


                /*
                 * Si por cualquier razón una vista activa
                 * quedó dentro de un submenú cerrado,
                 * lo abrimos automáticamente.
                 */

                document
                    .querySelectorAll(
                        ".odin-sidebar-subitem-active"
                    )
                    .forEach(function (activeItem) {


                        const submenu =
                            activeItem.closest(
                                ".odin-sidebar-submenu"
                            );


                        if (!submenu) {
                            return;
                        }


                        submenu
                            .classList
                            .remove("odin-hidden");


                        const button =
                            document.querySelector(
                                '[data-submenu="' +
                                submenu.id +
                                '"]'
                            );


                        if (!button) {
                            return;
                        }


                        button.setAttribute(
                            "aria-expanded",
                            "true"
                        );


                        const chevron =
                            button.querySelector(
                                ".odin-sidebar-chevron"
                            );


                        if (chevron) {

                            chevron
                                .classList
                                .add(
                                    "odin-chevron-open"
                                );

                        }

                    });

            }
        );



        /*
         * =====================================================
         * ESCAPE
         * =====================================================
         */

        document.addEventListener(
            "keydown",
            function (event) {


                if (event.key !== "Escape") {
                    return;
                }


                if (window.innerWidth < 768) {

                    window
                        .odinCloseSidebar();

                }

            }
        );



        /*
         * =====================================================
         * RESIZE
         * =====================================================
         */

        window.addEventListener(
            "resize",
            function () {


                if (window.innerWidth >= 768) {

                    window
                        .odinCloseSidebar();

                }

            }
        );

    </script>

</aside>



<!-- =========================================================
     OVERLAY
========================================================= -->

<div th:fragment="sidebarOverlay"
     id="overlay"
     class="fixed inset-0 bg-black/40 z-30 hidden md:hidden"
     onclick="odinCloseSidebar()">
</div>



<!-- =========================================================
     TOPBAR
========================================================= -->

<header th:fragment="topbar(title)"
        class="odin-topbar">


    <!-- =====================================================
         IZQUIERDA
    ====================================================== -->

    <div class="odin-topbar-left">


        <!-- MOBILE MENU -->

        <button type="button"
                class="odin-mobile-menu-button"
                aria-label="Abrir menú"
                onclick="odinOpenSidebar()">


            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M4 6h16"/>

                <path d="M4 12h16"/>

                <path d="M4 18h16"/>

            </svg>

        </button>



        <!-- TÍTULO -->

        <div class="odin-topbar-title">

            <span th:text="${title != null
                    ? title
                    : 'ODIN'}">

                ODIN

            </span>

        </div>

    </div>



    <!-- =====================================================
         DERECHA
    ====================================================== -->

    <div class="odin-topbar-right">


        <!-- =================================================
             NOTIFICACIONES
        ================================================== -->

        <button type="button"
                class="odin-topbar-icon-button"
                aria-label="Notificaciones">


            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8">


                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>


                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>

            </svg>

        </button>



        <!-- =================================================
             MENÚ USUARIO
        ================================================== -->

        <div class="odin-user-menu"
             id="odinUserMenu">


            <button type="button"
                    class="odin-user-button"
                    aria-haspopup="true"
                    aria-expanded="false"
                    onclick="odinToggleUserMenu(event, this)">


                <!-- AVATAR -->

                <div class="odin-user-avatar">

                    <span th:text="${#authentication != null
                            && #authentication.name != null
                            ? #strings.substring(
                                #authentication.name,
                                0,
                                1
                              ).toUpperCase()
                            : 'U'}">

                        U

                    </span>

                </div>



                <!-- DATOS -->

                <div class="odin-user-text">

                    <strong>
                        Usuario
                    </strong>


                    <span th:text="${#authentication != null
                            ? #authentication.name
                            : 'Sesión activa'}">

                        Sesión activa

                    </span>

                </div>



                <!-- FLECHA -->

                <svg class="odin-user-chevron"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="m6 9 6 6 6-6"/>

                </svg>

            </button>



            <!-- =================================================
                 DROPDOWN
            ================================================== -->

            <div id="userDropdown"
                 class="odin-user-dropdown odin-hidden">


                <!-- INFO -->

                <div class="odin-user-dropdown-header">


                    <div class="odin-user-dropdown-avatar">

                        <span th:text="${#authentication != null
                                && #authentication.name != null
                                ? #strings.substring(
                                    #authentication.name,
                                    0,
                                    1
                                  ).toUpperCase()
                                : 'U'}">

                            U

                        </span>

                    </div>


                    <div>

                        <strong>
                            Sesión actual
                        </strong>


                        <span th:text="${#authentication != null
                                ? #authentication.name
                                : 'Usuario ODIN'}">

                            Usuario ODIN

                        </span>

                    </div>

                </div>



                <div class="odin-user-dropdown-divider">
                </div>



                <!-- =================================================
                     LOGOUT
                ================================================== -->

                <form th:action="@{/logout}"
                      method="post">


                    <button type="submit"
                            class="odin-user-logout">


                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.8">


                            <path d="M10 17l5-5-5-5"/>


                            <path d="M15 12H3"/>


                            <path d="M21 19V5a2 2 0 0 0-2-2h-6"/>

                        </svg>


                        <span>
                            Cerrar sesión
                        </span>

                    </button>

                </form>

            </div>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT TOPBAR
         TAMBIÉN AUTOCONTENIDO
    ====================================================== -->

    <script>

        /*
         * =====================================================
         * MENÚ USUARIO
         * =====================================================
         */

        window.odinToggleUserMenu = function (
            event,
            button
        ) {


            if (event) {

                event.stopPropagation();

            }


            const dropdown =
                document.getElementById(
                    "userDropdown"
                );


            if (!dropdown) {
                return;
            }


            const isHidden =
                dropdown.classList.contains(
                    "odin-hidden"
                );


            if (isHidden) {


                dropdown
                    .classList
                    .remove("odin-hidden");


                if (button) {

                    button.setAttribute(
                        "aria-expanded",
                        "true"
                    );

                }


            } else {


                dropdown
                    .classList
                    .add("odin-hidden");


                if (button) {

                    button.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }

            }

        };



        /*
         * =====================================================
         * CERRAR AL HACER CLICK FUERA
         * =====================================================
         */

        document.addEventListener(
            "click",
            function (event) {


                const userMenu =
                    document.getElementById(
                        "odinUserMenu"
                    );


                const dropdown =
                    document.getElementById(
                        "userDropdown"
                    );


                if (!userMenu || !dropdown) {
                    return;
                }


                if (
                    !userMenu.contains(
                        event.target
                    )
                ) {

                    dropdown
                        .classList
                        .add("odin-hidden");


                    const button =
                        userMenu.querySelector(
                            ".odin-user-button"
                        );


                    if (button) {

                        button.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }

            }
        );



        /*
         * =====================================================
         * ESCAPE
         * =====================================================
         */

        document.addEventListener(
            "keydown",
            function (event) {


                if (event.key !== "Escape") {
                    return;
                }


                const dropdown =
                    document.getElementById(
                        "userDropdown"
                    );


                if (dropdown) {

                    dropdown
                        .classList
                        .add("odin-hidden");

                }


                const button =
                    document.querySelector(
                        ".odin-user-button"
                    );


                if (button) {

                    button.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                }

            }
        );

    </script>

</header>
