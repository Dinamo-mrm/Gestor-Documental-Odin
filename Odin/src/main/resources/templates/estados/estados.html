<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estados | ODIN</title>
    <script>
      try { if (localStorage.getItem('odin-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/styleguide.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/odin.css}">
    <link rel="stylesheet" th:href="@{/css/odin-dark.css}">
</head>
<body class="bg-[#f5f6f8] text-slate-800">
<div class="min-h-screen flex">
    <div th:replace="~{fragments/layout :: sidebar('estados')}"></div>
    <div class="fixed inset-0 bg-black/40 z-20 hidden" id="overlay" aria-hidden="true"></div>
    <div class="flex-1 min-w-0 flex flex-col">
        <div th:replace="~{fragments/layout :: topbar('Estados')}"></div>
        <main class="px-4 md:px-8 py-6 flex-1">
            <section class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <h1 class="odin-page-title">Estados</h1>
                    <p class="text-sm text-slate-500 mt-1">Catálogo de estados del flujo documental (máx. 10 por página).</p>
                </div>
                <a th:href="@{/view/estados/form}" class="inline-flex items-center justify-center rounded-md px-4 py-2 text-sm font-semibold text-white"
                   style="background:#39A900">Nuevo estado</a>
            </section>

            <div th:if="${mensaje}" class="mb-4 rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-800" th:text="${mensaje}"></div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase">
                        <tr>
                            <th class="px-4 py-3 text-left">ID</th>
                            <th class="px-4 py-3 text-left">Nombre</th>
                            
                            <th class="px-4 py-3 text-right">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="e : ${estados}" class="border-t border-slate-100 hover:bg-slate-50">
                            <td class="px-4 py-3" th:text="${e.id_estado}">1</td>
                            <td class="px-4 py-3 font-semibold" th:text="${e.nombre}">radicado</td>
                            
                            <td class="px-4 py-3 text-right whitespace-nowrap">
                                <a class="text-green-700 font-semibold mr-3" th:href="@{/view/estados/edit/{id}(id=${e.id_estado})}">Editar</a>
                                <form th:action="@{/view/estados/delete/{id}(id=${e.id_estado})}" method="post" class="inline"
                                      onsubmit="return confirm('¿Eliminar este estado?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="text-red-600 font-semibold">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${estados == null or #lists.isEmpty(estados)}">
                            <td colspan="3" class="px-4 py-8 text-center text-slate-400">No hay estados registrados.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="flex items-center justify-between px-4 py-3 border-t border-slate-100 text-sm"
                     th:if="${totalPages != null and totalPages > 1}">
                    <a th:if="${currentPage > 0}" th:href="@{/view/estados(page=${currentPage - 1})}" class="text-green-700 font-semibold">← Anterior</a>
                    <span th:unless="${currentPage > 0}"></span>
                    <span class="text-slate-500">Página <span th:text="${currentPage + 1}">1</span> de <span th:text="${totalPages}">1</span></span>
                    <a th:if="${currentPage + 1 < totalPages}" th:href="@{/view/estados(page=${currentPage + 1})}" class="text-green-700 font-semibold">Siguiente →</a>
                    <span th:unless="${currentPage + 1 < totalPages}"></span>
                </div>
            </div>
        </main>
    </div>
</div>
<script defer th:src="@{/js/script.js}"></script>
<script defer th:src="@{/js/odin-ui.js}"></script>
</body>
</html>
