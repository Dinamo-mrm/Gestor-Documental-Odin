<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acceso restringido | ODIN</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-50">


<div class="min-h-screen flex items-center justify-center px-6">


    <div class="max-w-lg w-full text-center">


        <div class="w-20 h-20 mx-auto rounded-3xl bg-green-100 text-green-700 flex items-center justify-center text-3xl font-black">

            !

        </div>


        <p class="mt-8 text-xs font-black tracking-[0.25em] text-green-700">

            ODIN · SEGURIDAD

        </p>


        <h1 class="mt-3 text-4xl font-black text-slate-900">

            Acceso restringido

        </h1>


        <p class="mt-4 text-slate-500 leading-7">

            Tu sesión está activa, pero tu usuario no
            cuenta con el permiso requerido para acceder
            a esta función.

        </p>


        <div class="mt-8 flex flex-col sm:flex-row justify-center gap-3">


            <a th:href="@{/view/dashboard}"
               class="rounded-xl bg-green-700 px-6 py-3 text-sm font-bold text-white hover:bg-green-800 transition">

                Ir al inicio

            </a>


            <button type="button"
                    onclick="history.back()"
                    class="rounded-xl border border-slate-300 bg-white px-6 py-3 text-sm font-bold text-slate-700 hover:bg-slate-100 transition">

                Regresar

            </button>


        </div>

    </div>

</div>


</body>

</html>
