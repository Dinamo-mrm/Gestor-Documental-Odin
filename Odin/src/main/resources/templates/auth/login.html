<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | ODIN SENA</title>
    <script>
      try { if (localStorage.getItem('odin-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/styleguide.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/odin.css}">
    <link rel="stylesheet" th:href="@{/css/odin-dark.css}">
    <style>
        .login-card { max-width: 420px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 1.25rem; padding: 2rem; box-shadow: 0 10px 40px rgba(15,23,42,.06); }
        .login-card h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: .25rem; }
        .login-card .sub { color: #64748b; font-size: .875rem; margin-bottom: 1.5rem; }
        .login-card label { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: .35rem; }
        .login-card input { width: 100%; border: 1px solid #cbd5e1; border-radius: .5rem; padding: .7rem .9rem; font-size: .9rem; margin-bottom: 1rem; background: #fff; }
        .login-card input:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.15); }
        .btn-login { width: 100%; background: #15803d; color: #fff; border: none; border-radius: .5rem; padding: .75rem; font-weight: 700; font-size: .95rem; cursor: pointer; }
        .btn-login:hover { background: #166534; }
        .login-links { display: flex; justify-content: space-between; margin-top: 1rem; font-size: .8rem; }
        .login-links a { color: #15803d; text-decoration: none; font-weight: 600; }
        .login-links a:hover { text-decoration: underline; }
        .hint { font-size: .75rem; color: #94a3b8; margin-top: -.5rem; margin-bottom: 1rem; }
        .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: .5rem; padding: .75rem; font-size: .85rem; margin-bottom: 1rem; }
        .brand { text-align: center; margin-bottom: 1.5rem; }
        .brand .logo { width: 56px; height: 56px; background: #15803d; border-radius: 1rem; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 1.25rem; }
    </style>
</head>
<body class="bg-[#f5f6f8] min-h-screen flex items-center justify-center p-4">
    <div class="login-card">
        <div class="brand">
            <div><center><img class="odin-logo--login" th:src="@{/img/odin-logo.png}"></div></center>
            <h1 class="mt-3">ODIN</h1>
            <p class="sub">Gestor Documental SENA · Inicio de sesión</p>
        </div>

        <!-- RF-01 + RF-N09: mensaje de error genérico (no revela si usuario existe) -->
        <div class="error-box" th:if="${param.error}">
            Credenciales inválidas o usuario inactivo. Verifique correo, identificación o nombre y contraseña.
        </div>
        <div class="error-box" th:if="${param.logout}" style="background:#f0fdf4;border-color:#bbf7d0;color:#166534;">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- RF-01: login flexible -->
            <label for="username">Correo, identificación o nombre de usuario</label>
            <input id="username" name="username" type="text" required autocomplete="username"
                   placeholder="ej: juan.perez@sena.edu.co · 1234567890 · jperez">
            <p class="hint">Puede ingresar con cualquiera de los tres identificadores.</p>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required autocomplete="current-password"
                   placeholder="••••••••">

            <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <div class="login-links">
            <a th:href="@{/recuperar-password}">¿Olvidó su contraseña?</a>
            <a href="#" onclick="document.documentElement.classList.toggle('dark'); localStorage.setItem('odin-theme', document.documentElement.classList.contains('dark')?'dark':'light'); return false;">Modo oscuro</a>
        </div>
    </div>
</body>
</html>
