<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rol y Permisos | ODIN</title>
    <script>
      try { if (localStorage.getItem('odin-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/styleguide.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/odin.css}">
    <link rel="stylesheet" th:href="@{/css/odin-dark.css}">
    <style>
        .form-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.5rem;margin-bottom:1rem}
        label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:.3rem}
        input[type=text],select{width:100%;border:1px solid #cbd5e1;border-radius:.5rem;padding:.55rem .75rem;font-size:.875rem;margin-bottom:1rem}
        .btn-primary{background:#15803d;color:#fff;border:none;border-radius:.5rem;padding:.65rem 1.25rem;font-weight:700;cursor:pointer}
        .btn-secondary{background:#fff;color:#334155;border:1px solid #cbd5e1;border-radius:.5rem;padding:.65rem 1.25rem;font-weight:600;text-decoration:none}
        .perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem}
        .perm-item{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border:1px solid #e2e8f0;border-radius:.5rem;background:#f8fafc;font-size:.85rem}
        .perm-item input{margin:0}
        .section-title{font-size:1rem;font-weight:700;margin:0 0 1rem;color:#0f172a}
    </style>
</head>
<body class="bg-[#f5f6f8] text-slate-800">
<div class="min-h-screen flex">
    <div th:replace="~{fragments/layout :: sidebar('roles')}"></div>
    <div class="fixed inset-0 bg-black/40 z-20 hidden" id="overlay"></div>

    <div class="flex-1 min-w-0 flex flex-col">
        <div th:replace="~{fragments/layout :: topbar('Roles y Permisos')}"></div>

        <main class="p-4 sm:p-6">
            <div class="max-w-3xl mx-auto">
                <h1 class="odin-page-title text-2xl font-bold mb-1"
                    th:text="${rol != null and rol.id_rol != null ? 'Editar rol' : 'Nuevo rol'}">Rol</h1>
                <p class="text-slate-600 mb-4">RF-N16 · RF-43 · RF-44 — Asignación visual de permisos</p>

                <form th:action="@{/view/roles/guardar}" th:object="${rol}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" th:field="*{id_rol}">

                    <div class="form-card">
                        <h2 class="section-title">Datos del rol</h2>
                        <label>Nombre del rol *</label>
                        <input type="text" th:field="*{nombre}" required maxlength="80" placeholder="ej: Analista de radicación">

                        <label>Código / clave del rol *</label>
                        <input type="text" th:field="*{rol}" required maxlength="80" placeholder="ej: ANALISTA">

                        <label>Estado</label>
                        <select th:field="*{estado}">
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>

                    <!-- Matriz de permisos RF-N16 -->
                    <div class="form-card">
                        <h2 class="section-title">Permisos asignados</h2>
                        <p style="font-size:.8rem;color:#64748b;margin-bottom:1rem">
                            Seleccione los permisos que tendrá este rol. Solo usuarios con <code>admin_roles</code> pueden modificar.
                        </p>
                        <div class="perm-grid">
                            <label class="perm-item" th:each="p : ${permisosDisponibles}">
                                <input type="checkbox" name="permisos" th:value="${p.id_permiso}"
                                       th:checked="${permisosAsignados != null and permisosAsignados.contains(p.id_permiso)}">
                                <span th:text="${(p.nombre != null ? p.nombre : p.accion) + ' — ' + (p.descripcion != null ? p.descripcion : (p.modulo != null ? p.modulo : ''))}">permiso</span>
                            </label>
                        </div>
                        <p th:if="${#lists.isEmpty(permisosDisponibles)}" style="color:#94a3b8;font-size:.85rem">
                            No hay permisos cargados. Ejecute el script de seed de permisos base.
                        </p>
                    </div>

                    <div style="display:flex;gap:.75rem">
                        <button type="submit" class="btn-primary">Guardar rol</button>
                        <a th:href="@{/view/roles}" class="btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script defer th:src="@{/js/script.js}"></script>
<script defer th:src="@{/js/odin-ui.js}"></script>
</body>
</html>
