<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rol y Permisos | ODIN</title>
    <script>
      try { if (localStorage.getItem('odin-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/styleguide.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/odin.css}">
    <link rel="stylesheet" th:href="@{/css/odin-dark.css}">
    <style>
        .form-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1.5rem;margin-bottom:1rem}
        label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;color:#64748b;margin-bottom:.3rem}
        input[type=text],select{width:100%;border:1px solid #cbd5e1;border-radius:.5rem;padding:.55rem .75rem;font-size:.875rem;margin-bottom:1rem}
        .btn-primary{background:#15803d;color:#fff;border:none;border-radius:.5rem;padding:.65rem 1.25rem;font-weight:700;cursor:pointer}
        .btn-secondary{background:#fff;color:#334155;border:1px solid #cbd5e1;border-radius:.5rem;padding:.65rem 1.25rem;font-weight:600;text-decoration:none}
        .perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem}
        .perm-item{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border:1px solid #e2e8f0;border-radius:.5rem;background:#f8fafc;font-size:.85rem}
        .perm-item input{margin:0}
        .section-title{font-size:1rem;font-weight:700;margin:0 0 1rem;color:#0f172a}
    </style>
    <link rel="icon" type="image/png" th:href="@{/img/odin-logo.png}" href="/img/odin-logo.png">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}" href="/favicon.ico">
</head>
<body class="bg-[#f5f6f8] text-slate-800">
<div class="min-h-screen flex">
    <div th:replace="~{fragments/layout :: sidebar('roles')}"></div>
    <div class="fixed inset-0 bg-black/40 z-20 hidden" id="overlay"></div>

    <div class="flex-1 min-w-0 flex flex-col">
        <div th:replace="~{fragments/layout :: topbar('Roles y Permisos')}"></div>

        <main class="p-4 sm:p-6">
            <div class="max-w-3xl mx-auto">
                <h1 class="odin-page-title text-2xl font-bold mb-1"
                    th:text="${rol != null and rol.id_rol != null ? 'Editar rol' : 'Nuevo rol'}">Rol</h1>
                <p class="text-slate-600 mb-4">RF-N16 · RF-43 · RF-44 — Asignación visual de permisos</p>

                <form th:action="@{/view/roles/guardar}" th:object="${rol}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" th:field="*{id_rol}">

                    <div class="form-card">
                        <h2 class="section-title">Datos del rol</h2>
                        <label>Nombre del rol *</label>
                        <input type="text" th:field="*{nombre}" required maxlength="80" placeholder="ej: Analista de radicación">

                        <label>Código / clave del rol *</label>
                        <input type="text" th:field="*{rol}" required maxlength="80" placeholder="ej: ANALISTA">

                        <!-- Estado: Solo visible al editar un rol existente -->
                        <div th:if="${rol.id_rol != null}">
                            <label>Estado</label>
                            <select th:field="*{estado}">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                        <!-- Al crear un nuevo rol se asigna Activo automáticamente -->
                        <input type="hidden" th:if="${rol.id_rol == null}" th:field="*{estado}" value="Activo">
                    </div>

                    <!-- Matriz de permisos estructurada y clara -->
                    <div class="form-card">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 border-b border-slate-100 pb-3 mb-4">
                            <div>
                                <h2 class="section-title mb-0.5">Matriz de Permisos y Accesos</h2>
                                <p class="text-xs text-slate-500">
                                    Selecciona las acciones y pantallas que los usuarios con este rol podrán utilizar en ODIN.
                                </p>
                            </div>
                            <div class="flex gap-2 shrink-0">
                                <button type="button" onclick="marcarTodos(true)"
                                        class="text-xs font-semibold text-green-700 bg-green-50 hover:bg-green-100 px-2.5 py-1 rounded border border-green-200 transition">
                                    ✓ Marcar todos
                                </button>
                                <button type="button" onclick="marcarTodos(false)"
                                        class="text-xs font-semibold text-slate-600 bg-slate-50 hover:bg-slate-100 px-2.5 py-1 rounded border border-slate-200 transition">
                                    ✕ Desmarcar todos
                                </button>
                            </div>
                        </div>

                        <!-- Categorías agrupadas -->
                        <div class="space-y-5">
                            <div th:each="cat : ${permisosPorCategoria}" class="bg-slate-50/70 rounded-xl p-4 border border-slate-200/80">
                                
                                <div class="flex items-center justify-between border-b border-slate-200 pb-2.5 mb-3">
                                    <h3 class="text-xs font-extrabold uppercase tracking-wide text-slate-700 flex items-center gap-1.5">
                                        <span th:text="${cat.key}">Categoría</span>
                                    </h3>
                                    <span class="text-[10px] font-bold text-slate-500 bg-white px-2 py-0.5 rounded-full border border-slate-200"
                                          th:text="${#lists.size(cat.value)} + ' permisos'">
                                    </span>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                                    <label th:each="p : ${cat.value}"
                                           class="relative flex items-start gap-3 p-3 rounded-lg border bg-white shadow-xs cursor-pointer hover:border-green-400 hover:bg-green-50/20 transition group"
                                           th:classappend="${permisosAsignados != null and permisosAsignados.contains(p.idPermiso)} ? 'border-green-500 ring-1 ring-green-500/20' : 'border-slate-200'">
                                        <input type="checkbox" name="permisos" th:value="${p.idPermiso}"
                                               onchange="toggleCheckVisual(this)"
                                               th:checked="${permisosAsignados != null and permisosAsignados.contains(p.idPermiso)}"
                                               class="mt-1 h-4 w-4 rounded border-slate-300 text-green-600 focus:ring-green-500 shrink-0">
                                        <div class="min-w-0 flex-1">
                                            <div class="flex items-center justify-between gap-1">
                                                <span class="text-xs font-bold text-slate-900 group-hover:text-green-800"
                                                      th:text="${p.titulo}">
                                                    Título del permiso
                                                </span>
                                                <span class="text-[10px] font-mono text-slate-400 font-normal shrink-0"
                                                      th:text="'[' + ${p.codigo} + ']'">
                                                    [codigo]
                                                </span>
                                            </div>
                                            <p class="text-[11px] text-slate-500 mt-0.5 leading-snug"
                                               th:text="${p.descripcion}">
                                                Descripción clara de lo que permite hacer.
                                            </p>
                                        </div>
                                    </label>
                                </div>

                            </div>
                        </div>

                        <p th:if="${#maps.isEmpty(permisosPorCategoria)}" style="color:#94a3b8;font-size:.85rem" class="text-center py-6">
                            No hay permisos cargados en la base de datos.
                        </p>
                    </div>

                    <div style="display:flex;gap:.75rem">
                        <button type="submit" class="btn-primary">Guardar rol</button>
                        <a th:href="@{/view/roles}" class="btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>
<script defer th:src="@{/js/script.js}"></script>
<script defer th:src="@{/js/odin-ui.js}"></script>
</body>
</html>
