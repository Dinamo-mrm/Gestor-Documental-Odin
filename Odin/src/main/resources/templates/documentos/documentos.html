<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos | ODIN</title>
    
    
    <style>body { font-family: 'Inter', sans-serif; }</style>
    
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/styleguide.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/odin.css}">
    <link rel="stylesheet" th:href="@{/css/odin-dark.css}">
</head>
<body class="bg-[#f5f6f8] text-slate-800">

<div class="min-h-screen flex">

    <div th:replace="~{fragments/layout :: sidebar('documentos')}"></div>
    <div class="fixed inset-0 bg-black/40 z-20 hidden" id="overlay" aria-hidden="true"></div>

    <div class="flex-1 min-w-0 flex flex-col">
        <div th:replace="~{fragments/layout :: topbar('Documentos')}"></div>

        <main class="px-4 md:px-8 py-6 flex-1">

            <section class="mb-6">
                <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                    <div>
                        <h1 class="odin-page-title">
                            Documentos
                        </h1>
                        <p class="text-sm text-slate-500 mt-2">
                            Consulte y administre los documentos cargados en el sistema.
                        </p>
                    </div>
                    <div class="flex gap-3">
                        <a th:href="@{/view/documentos/form}"
                           class="inline-flex items-center justify-center rounded-lg bg-[#2fa300] px-6 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-[#248400] transition">
                            Nuevo documento
                        </a>
                    </div>
                </div>
            </section>

            <div th:if="${success}" class="mb-5">
                <div class="rounded-lg border border-green-200 bg-green-50 px-5 py-3 text-sm text-green-800 shadow-sm"
                     th:text="${success}"></div>
            </div>
            <div th:if="${mensaje}" class="mb-5">
                <div class="rounded-lg border border-green-200 bg-green-50 px-5 py-3 text-sm text-green-800 shadow-sm"
                     th:text="${mensaje}"></div>
            </div>

            <section class="mb-5">
                <div class="relative">
                    <span class="absolute inset-y-0 left-4 flex items-center text-slate-400">🔍</span>
                    <input type="text" placeholder="Buscar por nombre, archivo o radicado..."
                           class="w-full rounded-lg border border-slate-200 bg-white py-3 pl-11 pr-4 text-sm text-slate-600 shadow-sm outline-none focus:border-green-500 focus:ring-2 focus:ring-green-100">
                </div>
            </section>

            <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="text-left px-5 py-3 font-bold text-slate-600">ID</th>
                            <th class="text-left px-5 py-3 font-bold text-slate-600">Radicado</th>
                            <th class="text-left px-5 py-3 font-bold text-slate-600">Nombre</th>
                            <th class="text-left px-5 py-3 font-bold text-slate-600">Archivo</th>
                            <th class="text-left px-5 py-3 font-bold text-slate-600">Tipo</th>
                            <th class="text-left px-5 py-3 font-bold text-slate-600">Tamaño</th>
                            <th class="text-left px-5 py-3 font-bold text-slate-600">Fecha subida</th>
                            <th class="text-left px-5 py-3 font-bold text-slate-600">Acciones</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                        <tr th:each="documento : ${documentos}" class="hover:bg-slate-50 transition">
                            <td class="px-5 py-4 text-slate-600" th:text="${documento.id_documento}">-</td>
                            <td class="px-5 py-4">
                                <a th:href="@{'/view/radicados/detalle/' + ${documento.id_radicado}}"
                                   class="text-green-700 font-semibold hover:underline"
                                   th:text="${documento.id_radicado}">-</a>
                            </td>
                            <td class="px-5 py-4 font-medium text-slate-800" th:text="${documento.nombre}">-</td>
                            <td class="px-5 py-4 text-slate-600" th:text="${documento.nombre_archivo}">-</td>
                            <td class="px-5 py-4">
                                <span class="inline-flex rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700"
                                      th:text="${documento.tipo}">-</span>
                            </td>
                            <td class="px-5 py-4 text-slate-600"
                                th:text="${documento.tamano != null ? documento.tamano + ' KB' : '-'}">-</td>
                            <td class="px-5 py-4 text-slate-600" th:text="${documento.fecha_subida}">-</td>
                            <td class="px-5 py-4">
                                <div class="flex items-center gap-2">
                                    <a th:href="@{'/view/documentos/edit/' + ${documento.id_documento}}"
                                       class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50"
                                       title="Editar">✏️</a>
                                    <form th:action="@{'/view/documentos/delete/' + ${documento.id_documento}}"
                                          method="post"
                                          onsubmit="return confirm('¿Eliminar este documento?');">
                                        <button type="submit"
                                                class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50"
                                                title="Eliminar">🗑️</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${documentos == null or #lists.isEmpty(documentos)}">
                            <td colspan="8" class="px-5 py-10 text-center text-slate-500">
                                No hay documentos registrados en este momento.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="flex items-center justify-between px-5 py-4 border-t border-slate-100 text-xs text-slate-500">
                    <span th:text="'Mostrando ' + (${documentos != null ? #lists.size(documentos) : 0}) + ' documentos registrados'">
                        Mostrando documentos registrados
                    </span>
                </div>
            </section>
        </main>
    </div>
</div>


    <script defer th:src="@{/js/script.js}"></script>
    <script defer th:src="@{/js/odin-ui.js}"></script>
</body>
</html>
