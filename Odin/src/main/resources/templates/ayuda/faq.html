<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntas Frecuentes | Centro de Ayuda ODIN</title>
    <script>
      try { if (localStorage.getItem('odin-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/globals.css}">
    <link rel="stylesheet" th:href="@{/css/styleguide.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/odin.css}">
    <link rel="stylesheet" th:href="@{/css/odin-dark.css}">
    <link rel="icon" type="image/png" th:href="@{/img/odin-logo.png}" href="/img/odin-logo.png">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}" href="/favicon.ico">
</head>
<body class="bg-[#f5f6f8] text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen">
<div class="min-h-screen flex">
    <div th:replace="~{fragments/layout :: sidebar('ayuda')}"></div>
    <div class="fixed inset-0 bg-black/40 z-20 hidden" id="overlay" aria-hidden="true"></div>

    <div class="flex-1 min-w-0 flex flex-col">
        <div th:replace="~{fragments/layout :: topbar('Preguntas Frecuentes')}"></div>

        <main class="p-4 sm:p-6 lg:p-8 flex-1">
            <div class="max-w-5xl mx-auto space-y-6">

                <!-- Breadcrumb y Cabecera -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <nav class="flex text-xs text-slate-500 dark:text-slate-400 mb-2" aria-label="Breadcrumb">
                            <ol class="inline-flex items-center space-x-1 sm:space-x-2">
                                <li>
                                    <a th:href="@{/view/ayuda}" class="hover:text-emerald-600 dark:hover:text-emerald-400">Centro de Ayuda</a>
                                </li>
                                <li class="flex items-center">
                                    <svg class="w-3 h-3 text-slate-400 mx-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                    <span class="text-slate-700 dark:text-slate-300 font-semibold">Preguntas Frecuentes</span>
                                </li>
                            </ol>
                        </nav>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Preguntas Frecuentes (FAQ)</h1>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Aclare dudas rápidas sobre el funcionamiento y normatividad de ODIN.</p>
                    </div>

                    <a th:href="@{/view/ayuda}"
                       class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg text-xs font-semibold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        <span>Volver al Inicio</span>
                    </a>
                </div>

                <!-- Buscador de Preguntas -->
                <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <input type="text" id="faqFilterInput"
                               placeholder="Escriba palabras clave para filtrar las preguntas (ej: radicados, anexos, contraseñas)..."
                               class="w-full pl-9 pr-4 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <!-- Filtro por Categorías (Pestañas) -->
                <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="filterCategory('ALL')"
                            class="category-btn active px-3.5 py-1.5 rounded-lg text-xs font-bold transition shadow-sm bg-emerald-600 text-white"
                            data-cat="ALL">
                        Todas (<span th:text="${totalFaqs}">38</span>)
                    </button>
                    <button type="button" th:each="cat : ${categorias}"
                            th:data-cat="${cat}"
                            onclick="filterCategory(this.getAttribute('data-cat'))"
                            class="category-btn px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:border-emerald-500 transition shadow-sm"
                            th:text="${cat}">Categoría</button>
                </div>

                <!-- Acordeón de Preguntas -->
                <div id="faqContainer" class="space-y-3">
                    <div th:each="faq : ${faqs}" th:id="${faq.id}"
                         th:data-category="${faq.categoria}"
                         th:data-search="${faq.pregunta + ' ' + faq.respuesta + ' ' + faq.categoria + ' ' + (faq.moduloRelacionado != null ? faq.moduloRelacionado : '') + ' ' + faq.palabrasClaveTexto}"
                         class="faq-item border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden bg-white dark:bg-slate-800 shadow-sm transition hover:border-emerald-400 dark:hover:border-emerald-600">
                        <button type="button"
                                class="faq-toggle-btn w-full text-left p-4 sm:p-5 flex items-center justify-between gap-4 font-semibold text-slate-900 dark:text-white hover:text-emerald-600 dark:hover:text-emerald-400 transition cursor-pointer"
                                onclick="toggleFaqAccordion(this)">
                            <div class="flex items-center gap-2.5 flex-wrap">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300"
                                      th:text="${faq.categoria}">Cat</span>
                                <span th:if="${faq.moduloRelacionado != null}"
                                      class="px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/50"
                                      th:text="${faq.moduloRelacionado}">Módulo</span>
                                <span class="text-sm sm:text-base text-slate-900 dark:text-white font-medium" th:text="${faq.pregunta}">Pregunta</span>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="text-xs text-emerald-600 dark:text-emerald-400 font-medium hidden sm:inline faq-status-text">Ver respuesta</span>
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 transition-transform duration-200 shrink-0 faq-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </button>
                        <div class="faq-content hidden p-5 pt-0 text-xs sm:text-sm text-slate-600 dark:text-slate-300 border-t border-slate-100 dark:border-slate-700/60 leading-relaxed space-y-3"
                             style="display: none;">
                            <div class="p-4 rounded-lg bg-slate-50 dark:bg-slate-900/60 border border-slate-100 dark:border-slate-800 text-slate-700 dark:text-slate-200 text-xs sm:text-sm whitespace-pre-line leading-relaxed mt-3"
                                 th:text="${faq.respuesta}">
                                Respuesta...
                            </div>
                            <div th:if="${faq.rutaAcceso != null}" class="pt-1">
                                <a th:href="@{${faq.rutaAcceso}}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-600 dark:text-emerald-400 hover:text-emerald-700 hover:underline">
                                    <span>Ir a la sección relacionada en el sistema</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                    </svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="noFaqFound" class="hidden text-center py-12 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-8">
                    <p class="text-slate-500 dark:text-slate-400 text-sm">No se encontraron preguntas que coincidan con el criterio seleccionado.</p>
                </div>

            </div>
        </main>
    </div>
</div>

<script>
    var currentCat = 'ALL';

    function toggleFaqAccordion(target) {
        if (!target) return;
        var btn = (target.tagName === 'BUTTON') ? target : target.closest('button');
        if (!btn) btn = target;
        var container = btn.closest('.faq-item') || btn.parentElement;
        var body = container.querySelector('.faq-content') || btn.nextElementSibling;
        var arrow = container.querySelector('.faq-arrow') || btn.querySelector('svg');
        var statusText = container.querySelector('.faq-status-text');

        if (!body) return;

        var isHidden = body.classList.contains('hidden') || body.style.display === 'none';

        if (isHidden) {
            body.classList.remove('hidden');
            body.style.display = 'block';
            if (arrow) arrow.style.transform = 'rotate(180deg)';
            if (statusText) statusText.textContent = 'Ocultar respuesta';
        } else {
            body.classList.add('hidden');
            body.style.display = 'none';
            if (arrow) arrow.style.transform = 'rotate(0deg)';
            if (statusText) statusText.textContent = 'Ver respuesta';
        }
    }

    function filterCategory(cat) {
        currentCat = cat || 'ALL';
        document.querySelectorAll('.category-btn').forEach(function(btn) {
            if (btn.getAttribute('data-cat') === currentCat) {
                btn.className = 'category-btn active px-3.5 py-1.5 rounded-lg text-xs font-bold transition shadow-sm bg-emerald-600 text-white';
            } else {
                btn.className = 'category-btn px-3.5 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:border-emerald-500 transition shadow-sm';
            }
        });
        applyFilters();
    }

    var filterInput = document.getElementById('faqFilterInput');
    if (filterInput) {
        filterInput.addEventListener('input', function() {
            applyFilters();
        });
    }

    function applyFilters() {
        var term = (filterInput ? filterInput.value : '').toLowerCase().trim();
        var items = document.querySelectorAll('.faq-item');
        var visibleCount = 0;

        items.forEach(function(it) {
            var itCat = it.getAttribute('data-category');
            var itSearch = (it.getAttribute('data-search') || '').toLowerCase();

            var matchesCat = (currentCat === 'ALL' || itCat === currentCat);
            var matchesTerm = (term === '' || itSearch.indexOf(term) !== -1);

            if (matchesCat && matchesTerm) {
                it.style.display = '';
                visibleCount++;
            } else {
                it.style.display = 'none';
            }
        });

        var noFound = document.getElementById('noFaqFound');
        if (noFound) {
            if (visibleCount === 0) noFound.classList.remove('hidden');
            else noFound.classList.add('hidden');
        }
    }

    // Navegación por hash (ej: /view/ayuda/faq#faq-rad-01)
    window.addEventListener('DOMContentLoaded', function() {
        if (window.location.hash) {
            var targetId = window.location.hash.substring(1);
            var targetEl = document.getElementById(targetId);
            if (targetEl) {
                var btn = targetEl.querySelector('button');
                if (btn) toggleFaqAccordion(btn);
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    });
</script>
</body>
</html>
