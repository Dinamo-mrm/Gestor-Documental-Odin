spring.application.name=odin

# =========================================================
# BASE DE DATOS - SUPABASE / POSTGRESQL
# =========================================================
# Las variables se leen desde:
#   1) Variables de entorno del sistema / Run Configuration de IntelliJ
#   2) Archivo .env en la raíz del módulo Odin (cargado por OdinApplication)
#   3) System properties
#
# Archivo esperado: Odin/.env
#   SUPABASE_DB_URL=jdbc:postgresql://...pooler.supabase.com:5432/postgres?sslmode=require
#   SUPABASE_DB_USERNAME=postgres.xxxxx
#   SUPABASE_DB_PASSWORD=********
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# =========================================================
# ARCHIVOS ADJUNTOS
# =========================================================
app.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# =========================================================
# RECUPERACIÓN DE CONTRASEÑA
# =========================================================
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:${SMTP_USERNAME:}}
app.reset-password.base-url=${APP_BASE_URL:http://localhost:8080}
app.reset-password.expiration-minutes=${RESET_PASSWORD_EXPIRATION_MINUTES:30}

# =========================================================
# OPENAPI / SWAGGER
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
